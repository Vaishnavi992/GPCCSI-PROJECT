{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#4f7cff,#7c3aed);border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your CyberShield account</div>
    </div>
    {% if error %}<div class="error-alert">{{ error }}</div>{% endif %}
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="your_username" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="form-submit">Sign In</button>
      <div class="form-link">Don't have an account? <a href="{% url 'signup' %}">Create one →</a></div>
    </form>
  </div>
</div>
{% endblock %}
